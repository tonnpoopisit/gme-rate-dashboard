<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GME Rate Dashboard — Login</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 2.5rem 2rem; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  h1 { font-size: 1.15rem; margin: 0 0 1.5rem; text-align: center; color: #f1f5f9; }
  input {
    width: 100%; padding: .75rem; font-size: 1.4rem; letter-spacing: .3rem; text-align: center;
    border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f1f5f9; margin-bottom: 1rem;
  }
  button {
    width: 100%; padding: .7rem; font-size: 1rem; border-radius: 8px; border: none;
    background: #3b82f6; color: white; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2563eb; }
  .error { color: #f87171; font-size: .85rem; text-align: center; margin-top: .75rem; min-height: 1.2em; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>GME Rate Dashboard</h1>
    <input type="password" inputmode="numeric" maxlength="6" placeholder="PIN" id="pin" autofocus>
    <button type="submit">Enter</button>
    <div class="error" id="error"></div>
  </form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = document.getElementById("pin").value.trim();
  const errEl = document.getElementById("error");
  errEl.textContent = "";
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin }),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = "/";
    } else {
      errEl.textContent = data.error || "Incorrect PIN";
    }
  } catch (err) {
    errEl.textContent = "Network error - try again";
  }
});
</script>
</body>
</html>
